<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارنامه مستمر – دبیرستان حکیم فرزانه</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#1d2b2a;--mut:#667;--pri:#0f5c4d;--line:#e2ded0;--warn:#fff1d6;--warnt:#8a5a00}
@media(prefers-color-scheme:dark){:root{--bg:#121a19;--card:#1b2625;--ink:#eef3f1;--mut:#9fb0ac;--pri:#4fc3a8;--line:#2c3b39;--warn:#3a2f12;--warnt:#f0c565}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Vazirmatn,sans-serif;line-height:1.8}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 40px}
header{text-align:center;padding:10px 0 18px}
.bism{color:var(--mut);font-size:14px}
h1{font-size:20px;margin:4px 0;color:var(--pri)}
.sub{font-size:14px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
label{display:block;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:18px;text-align:center;letter-spacing:2px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);direction:ltr}
button{font:inherit;width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0b1412}}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.err{color:#c0392b;margin-top:10px;font-size:14px;text-align:center;min-height:1px}
.who{text-align:center}.who b{font-size:19px}.who span{color:var(--mut);font-size:14px}
.avg{text-align:center;margin:14px 0;padding:14px;border-radius:12px;background:var(--bg)}
.avg big{display:block;font-size:34px;color:var(--pri);font-weight:bold}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
td:last-child{text-align:center;font-weight:bold;width:70px}
tr.low td:last-child{background:var(--warn);color:var(--warnt);border-radius:6px}
.note{font-size:12.5px;color:var(--mut);margin-top:12px}
#res{display:none}
@media print{body{background:#fff;color:#000}button,#form{display:none!important}.card{border:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="bism">به نام خدا</div>
<h1>دبیرستان غیردولتی پسرانه حکیم فرزانه</h1>
<div class="sub">ناحیه ۵ اصفهان &nbsp;|&nbsp; مدیر: آقای عظیمی</div>
<div class="sub">کارنامه مستمر مهر و آبان ۱۴۰۵</div>
</header>
<div class="card" id="form">
<label for="nid">کد ملی دانش‌آموز را وارد کنید</label>
<input id="nid" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="----------">
<button id="go">مشاهده کارنامه</button>
<div class="err" id="err"></div>
</div>
<div class="card" id="res">
<div class="who"><b id="nm"></b><br><span id="cl"></span></div>
<div class="avg">معدل<big id="av"></big></div>
<table id="tb"></table>
<div class="note">نمره‌های کمتر از ۱۸ با رنگ زرد مشخص شده‌اند و نیاز به تلاش بیشتر دارند. این کارنامه جنبه اطلاع‌رسانی دارد.</div>
<button onclick="window.print()">چاپ کارنامه</button>
<button class="ghost" id="back">جستجوی دیگر</button>
</div>
</div>

const $=i=>document.getElementById(i),enc=new TextEncoder();
const fa=s=>String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]).replace(".","٫");
const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,"0")).join("");
function norm(s){return s.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,"")}
async function look(n){
 const k=await crypto.subtle.importKey("raw",enc.encode(n),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(SALT),iterations:ITER,hash:"SHA-256"},k,512));
 const rec=DATA[hex(bits.slice(0,16))];if(!rec)return null;
 const key=await crypto.subtle.importKey("raw",bits.slice(32),"AES-GCM",false,["decrypt"]);
 const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(rec[0])},key,b2u(rec[1]));
 return JSON.parse(new TextDecoder().decode(p));
}
async function run(){
 const e=$("err");e.textContent="";
 const n=norm($("nid").value).padStart(10,"0");
 if(norm($("nid").value).length<9){e.textContent="کد ملی را کامل وارد کنید.";return}
 $("go").disabled=true;$("go").textContent="در حال جستجو...";
 try{
  const r=await look(n);
  if(!r){e.textContent="کارنامه‌ای با این کد ملی پیدا نشد. کد را بررسی کنید یا با مدرسه تماس بگیرید.";return}
  $("nm").textContent=r.n;$("cl").textContent="کلاس: "+r.c;$("av").textContent=fa(r.a.toFixed(2));
  $("tb").innerHTML=r.g.map(x=>`<tr class="${x[1]<18?"low":""}"><td>${x[0]}</td><td>${fa(x[1])}</td></tr>`).join("");
  $("form").style.display="none";$("res").style.display="block";
 }catch(x){e.textContent="خطا در نمایش کارنامه."}
 finally{$("go").disabled=false;$("go").textContent="مشاهده کارنامه"}
}
$("go").onclick=run;$("nid").onkeydown=e=>{if(e.key==="Enter")run()};
$("back").onclick=()=>{$("nid").value="";$("res").style.display="none";$("form").style.display="block"};
</script>
